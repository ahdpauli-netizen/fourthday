# Publishes the oldest captioned image in queue/ to Instagram @fourthday_.
name: Post to Instagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be posted, publish nothing)"
        type: boolean
        default: true
  # Weekdays: 7h30 / 12h00 / 20h00 Brasília (10:30 / 15:00 / 23:00 UTC).
  # Saturday and Sunday: only 12h00 (Adriano, 2026-10-18).
  # GitHub starts scheduled runs 10-20 min late, so each cron fires 35 min
  # early and the "Wait for posting time" step sleeps until the exact time.
  schedule:
    - cron: "55 9 * * 1-5"
    - cron: "25 14 * * *"
    - cron: "25 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fourthday-repo
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Days with no scheduled posts left (Brasília dates), and single slots
      # Adriano posts by hand (date_slot, slot = 0730 / 1200 / 2000).
      - name: Skip listed days and slots
        id: gate
        if: github.event_name == 'schedule'
        env:
          SKIP_DATES: "2026-10-18"
          SKIP_SLOTS: "2026-10-19_1200"
        run: |
          today=$(TZ=America/Sao_Paulo date +%F)
          hour=$(TZ=America/Sao_Paulo date +%-H)
          if [ $hour -lt 9 ]; then slot=0730; elif [ $hour -lt 15 ]; then slot=1200; else slot=2000; fi
          for d in $SKIP_DATES $SKIP_SLOTS; do
            if [ "$d" = "$today" ] || [ "$d" = "${today}_$slot" ]; then echo "::notice::No automatic post for $today $slot"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          done
      - name: Wait for posting time
        if: github.event_name == 'schedule' && steps.gate.outputs.skip != 'true'
        run: |
          now=$(date -u +%s)
          for hm in 10:30 15:00 23:00; do
            t=$(date -u -d "today $hm" +%s)
            wait=$((t - now))
            if [ $wait -gt 0 ] && [ $wait -le 3600 ]; then
              echo "Waiting ${wait}s until $hm UTC"
              sleep $wait
              break
            fi
          done
      - name: Publish
        if: steps.gate.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            args=""
          else
            args="--dry-run"
            python fourthday.py recent 2>&1 | sed "s/^/::warning::/" || true
          fi
          set +e
          python fourthday.py publish $args 2>&1 | tee out.txt
          rc=${PIPESTATUS[0]}
          # Surface the error as an annotation, which can be read without the full log.
          [ $rc -ne 0 ] && echo "::error::$(tail -c 900 out.txt | tr '\n' ' ')"
          exit $rc
      - name: Save to the repository
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "fourthday-bot"
          git config user.email "fourthday-bot@users.noreply.github.com"
          git add -A queue posted history.json
          git diff --cached --quiet && exit 0
          git commit -m "Posted to Instagram"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
