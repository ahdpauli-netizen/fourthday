# Publishes the oldest captioned image in queue/ to Instagram @fourthday_.
name: Post to Instagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be posted, publish nothing)"
        type: boolean
        default: true
  # Turned on in checklist step 9 (times in UTC; 11/16/23 UTC = 8h/13h/20h Brasília):
  # schedule:
  #   - cron: "0 11 * * *"
  #   - cron: "0 16 * * *"
  #   - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: fourthday-repo
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            python fourthday.py publish
          else
            python fourthday.py publish --dry-run
          fi
      - name: Save to the repository
        run: |
          git config user.name "fourthday-bot"
          git config user.email "fourthday-bot@users.noreply.github.com"
          git add -A queue posted history.json
          git diff --cached --quiet && exit 0
          git commit -m "Posted to Instagram"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
