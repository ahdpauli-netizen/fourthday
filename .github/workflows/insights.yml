# Collects reach/engagement of @fourthday_ daily (5h15 Brasília, before the 5h40 caption routine).
name: Instagram insights

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: write

concurrency:
  group: fourthday-repo
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set +e
          python fourthday.py insights 2>&1 | tee out.txt
          rc=${PIPESTATUS[0]}
          # Surface the error as an annotation, which can be read without the full log.
          [ $rc -ne 0 ] && echo "::error::$(tail -c 900 out.txt | tr '\n' ' ')"
          exit $rc
      - name: Save to the repository
        run: |
          git config user.name "fourthday-bot"
          git config user.email "fourthday-bot@users.noreply.github.com"
          git add -A insights
          git diff --cached --quiet && exit 0
          git commit -m "Insights $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
