# Finds new images, crops them to 4:5 and adds them to queue/.
# Captions (caption.txt) are written afterwards, then post.yml publishes.
name: Prepare images

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many images the queue should hold"
        default: "3"
  push:
    branches: ["claude/**"]
    paths: ["fourthday.py", ".github/workflows/prepare.yml"]
  # Turned on in checklist step 9:
  # schedule:
  #   - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: fourthday-repo
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the image sources
        run: python fourthday.py selftest
      - name: Fill the queue
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python fourthday.py prepare --count "${{ github.event.inputs.count || '1' }}"
      - name: Save to the repository
        run: |
          git config user.name "fourthday-bot"
          git config user.email "fourthday-bot@users.noreply.github.com"
          git add queue history.json 2>/dev/null || git add queue
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Queue new images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
